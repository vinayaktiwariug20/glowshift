name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The app is Windows-only (Bluetooth via WinRT, Tk GUI); tests never touch hardware.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install
        # A block value: ":all: " would otherwise read as YAML key syntax.
        run: |
          python -m pip install --only-binary :all: -e ".[test]"
      - name: Test
        run: python -m pytest
