[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glowshift"
version = "0.1.0"
description = "Screen-reactive RGB lighting for Windows, for the Govee H617A Bluetooth LED strip"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vinayak Tiwari" }]
# Only 3.14 is tested. On 3.12 the simulated Bluetooth timing tests differ.
requires-python = ">=3.14"
dependencies = [
    "bleak>=3.0,<4",
    "mss>=10,<11",
    "numpy>=2,<3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]

[project.optional-dependencies]
# Only the offline experimental adaptive prototype needs Pillow.
experimental = ["pillow>=12,<13"]
test = ["pytest>=9", "pillow>=12,<13"]

[project.gui-scripts]
glowshift = "glowshift.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
